name: Hallo Pipeline
on: 
  push:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  hallo:
    runs-on: ubuntu-latest
    steps:
      - name: Show directory
        run: pwd
      - name: Dateien anzeigen
        run: ls
      - name: Gruss ausgeben
        run: echo "Mein erster Workflow läuft!"
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - name: Datum anzeigen
        run: date
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4
      - name: Links pruefen
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress lesetipps.md
          fail: true
          failIfEmpty: false